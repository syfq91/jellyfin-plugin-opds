changelog: |-
  - Security: Include remote IP in Basic Auth cache key to prevent cross-IP cache reuse and auth bypass (C-1)
  - Security: Enforce per-item user visibility authorization checks on download, cover, thumbnail, and stream endpoints (M-7)
  - Fix: Folder view returning empty feed by properly resolving UserView and CollectionFolder hierarchies
  - Add: Hierarchical folder view navigation (/opds/Folders and /opds/Folders/{folderId}) with pagination and rel='up' hierarchy navigation
  - Optimize: Mobile and e-reader browsing performance with OPDS 1.2 pagination, OpenSearch metadata, in-memory Basic Auth caching, fast-path page counting, and cover thumbnail endpoint (/opds/Thumbnail/{bookId})
  - Fix: Remove UTF-8 BOM from Atom and OpenSearch XML feeds to fix KOReader catalog browsing
  - Add: OPDS page streaming extension (OPDS-PSE) support for comic archives and PDF documents, including reading progress, disabled by default (#29)
  - Add: reading position synchronization via the draft OPDS Progression specification, including server-derived references, an OPDS authentication document and stored device/title fidelity, disabled by default
  - Unstable: Update to latest Jellyfin preview packages (#53) @crobibero, @jellyfin-bot
